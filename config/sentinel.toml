[telemetry]
interval_seconds = 5

[process]
enabled = true
include_command_line = true

[network]
enabled = true
include_udp = true

[filesystem]
enabled = true
paths = ["/etc", "/usr/local/bin", "/tmp"]
recursive = false

[logging]
level = "info"
json = false

[baseline]
enabled = true
path = "state/baseline.json"
initialize_on_first_run = true
learn_new = true

[behavior]
enabled = true
learn_new = true
track_outbound = true
track_remote_endpoints = true
track_remote_ports = true
